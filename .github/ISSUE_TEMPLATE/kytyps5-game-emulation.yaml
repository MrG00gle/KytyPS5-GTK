name: Game Emulation Status Report
description: Submit a KytyPS5-GTK game compatibility result, including boot, rendering, audio, input, or gameplay behavior.
title: "[GAME STATUS]: "
body:
  - type: markdown
    attributes:
      value: |
        ## Quick checks

        Before submitting, please:
        - Search existing issues first.
        - Re-test with a clean game dump.
        - Use the latest KytyPS5-GTK build available to you.
        - Attach the complete log file instead of edited snippets.

  - type: markdown
    attributes:
      value: |
        ## Game and build

  - type: input
    id: game-title
    attributes:
      label: Game title
      description: Use the full title shown by the game or launcher.
      placeholder: "Example: Astro Bot"
    validations:
      required: true

  - type: input
    id: game-id
    attributes:
      label: Game ID / serial
      description: Enter the ID or serial when available. If you cannot find it, write "Unknown".
      placeholder: "Example: PPSA12345 or Unknown"
    validations:
      required: true

  - type: input
    id: kyty-version
    attributes:
      label: KytyPS5-GTK version
      description: Include the exact build you tested (the release tag, or the commit of a source build) so the report can be matched to the right code.
      placeholder: "Example: KytyPS5-GTK-2026-11-12-1a2b3c4"
    validations:
      required: true

  - type: dropdown
    id: installation-type
    attributes:
      label: Installation type
      description: Select how you installed the build you tested.
      options:
        - Flatpak
        - release archive
        - source build
    validations:
      required: true

  - type: dropdown
    id: compatibility-status
    attributes:
      label: Compatibility status
      description: Select the furthest point the game consistently reaches on this build.
      options:
        - "Doesn't boot"
        - Logo
        - Main menu
        - In game
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        **Status guide**
        - **Doesn't boot:** The game does not show its first logo or startup screen.
        - **Logo:** The game shows a logo or startup screen but does not reach the main menu.
        - **Main menu:** The game reaches its menus but does not enter gameplay.
        - **In game:** The game reaches controllable gameplay, even if bugs prevent completion.

  - type: input
    id: regression-builds
    attributes:
      label: Last working build / first broken build
      description: Optional. Fill this in if the same game worked in an older KytyPS5-GTK build.
      placeholder: "Example: last worked in KytyPS5-GTK-2026-11-01-0a1b2c3, first broke in KytyPS5-GTK-2026-11-12-1a2b3c4"

  - type: markdown
    attributes:
      value: |
        ## Test result

  - type: textarea
    id: what-happened
    attributes:
      label: Result details
      description: Describe what worked, what failed, and any visible or audible problems.
      placeholder: "Example: The game reaches the main menu, then freezes after selecting Continue. Audio plays correctly until the freeze."
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce the result
      description: List the shortest path to the reported status or failure from a fresh KytyPS5-GTK start.
      placeholder: |
        1. Open the KytyPS5-GTK launcher.
        2. Boot the game.
        3. Select ...
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: Explain what should happen at the same point in the game. If there is no known problem, write "No known issue".
      placeholder: "Example: The save should load and gameplay should continue normally."
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Host system

  - type: input
    id: distribution
    attributes:
      label: Linux distribution and version
      description: Include the distribution name and version, and the edition or desktop when useful.
      placeholder: "Example: Fedora 43 Workstation"
    validations:
      required: true

  - type: input
    id: cpu
    attributes:
      label: CPU
      description: Include the exact processor model.
      placeholder: "Example: AMD Ryzen 9 9950X3D"
    validations:
      required: true

  - type: input
    id: gpu
    attributes:
      label: GPU
      description: Include the graphics card model and driver version when available.
      placeholder: "Example: AMD Radeon RX 7800 XT, Mesa 25.1.5 (RADV)"
    validations:
      required: true

  - type: input
    id: ram-vram
    attributes:
      label: RAM / VRAM
      description: Include both system memory and video memory.
      placeholder: "Example: 64 GB DDR5 RAM / 16 GB VRAM"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Evidence

  - type: textarea
    id: log-file
    attributes:
      label: Log file upload
      description: Before you reproduce the problem, set Printf output (Debug page of Global settings or of the game's config) to Console, then save the full log from the launcher's log view (Save log…). Or set it to File and take _kyty.txt from the data folder. With the default Silent, the log is nearly empty. Drag the file into this box, or link to the complete unmodified file.
      placeholder: "Attach the full log file here."
    validations:
      required: true

  - type: textarea
    id: screenshots-video
    attributes:
      label: Screenshots/video
      description: Optional. Add images or footage when the problem is visible or audible.
      placeholder: "Drag and drop media here, or paste links."

  - type: textarea
    id: extra-notes
    attributes:
      label: Extra notes
      description: Optional. Add settings, unusual hardware details, or anything else that may help.
      placeholder: "Any extra context goes here."
